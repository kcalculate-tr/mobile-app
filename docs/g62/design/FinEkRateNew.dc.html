<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>eatkcal · puan ve “Yeni” rozeti kuralı · Light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 900px; box-sizing: border-box; padding: 28px 16px; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4; border-radius: 44px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: {{c.sec}}">{{L.eyebrow}}</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.2">{{L.title}}</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cards}}" as="k" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: {{c.sec}}">{{k.cap}}</span>
<div style="border-radius: 18px; overflow: hidden; background: {{c.card}}; box-shadow: inset 0 0 0 1px {{c.line}}">
<img src="{{k.img}}" alt="" style="display: block; width: 100%; height: 72px; object-fit: cover">
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px">
<b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px">{{k.name}}</b>
<sc-if value="{{k.rated}}" hint-placeholder-val="{{ true }}">
<span role="img" aria-label="{{L.aria}}" style="display: inline-flex; align-items: center; gap: 5px">
<span aria-hidden="true" style="display: inline-flex; gap: 1px">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
<span style="position: relative; width: 13px; height: 13px; flex: none"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 256 256" fill="{{c.ink}}" style="position: absolute; inset: 0"><path d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Zm-15.34,5.47-48.7,42a8,8,0,0,0-2.56,7.91l14.88,62.8a.37.37,0,0,1-.17.48c-.18.14-.23.11-.38,0l-54.72-33.65a8,8,0,0,0-8.38,0L69.09,215.94c-.15.09-.19.12-.38,0a.37.37,0,0,1-.17-.48l14.88-62.8a8,8,0,0,0-2.56-7.91l-48.7-42c-.12-.1-.23-.19-.13-.5s.18-.27.33-.29l63.92-5.16A8,8,0,0,0,103,91.86l24.62-59.61c.08-.17.11-.25.35-.25s.27.08.35.25L153,91.86a8,8,0,0,0,6.75,4.92l63.92,5.16c.15,0,.24,0,.33.29S224,102.63,223.84,102.73Z"></path></svg><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{st.w}}; overflow: hidden"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 256 256" fill="{{c.ink}}" style="display: block"><path d="M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z"></path></svg></span></span>
</sc-for>
</span>
<b aria-hidden="true" style="font-size: 13px">{{val}}</b>
</span>
</sc-if>
<sc-if value="{{k.isNew}}" hint-placeholder-val="{{ false }}">
<span role="img" aria-label="{{L.newAria}}" style="align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 11px; background: #C6F04F; color: #0A0A0A; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">{{L.newB}}</span>
</sc-if>
<span style="font-size: 13px; line-height: 1.3; color: {{c.sec}}">{{k.sub}}</span>
</div>
</div>
</div>
</sc-for>
</div>

<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
<li style="padding: 12px 14px; border-radius: 16px; background: {{c.card}}; display: flex; gap: 12px; align-items: flex-start">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 13px; background: {{c.ink}}; color: {{c.onInk}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{r.n}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px">{{r.t}}</b><span style="font-size: 13px; color: {{c.sec}}">{{r.d}}</span></span>
</li>
</sc-for>
</ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["tr","en"],"default":"tr"},"$preview":{"width":393,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var P = this.props, dark = P.theme === 'dark', en = P.lang === 'en';
    var c = dark
      ? { bg: '#000000', card: '#1C1C1E', ink: '#F5F5F5', onInk: '#0A0A0A', sec: '#A1A1A6', line: '#2C2C2E' }
      : { bg: '#F3F4F6', card: '#FFFFFF', ink: '#0A0A0A', onInk: '#FFFFFF', sec: '#6B6B70', line: '#E9EBEE' };
    var v = 4.5, vs = en ? '4.5' : '4,5', stars = [];
    for (var i = 1; i <= 5; i++) stars.push({ w: (v >= i ? 100 : v >= i - 0.5 ? 50 : 0) + '%' });
    var L = en
      ? { eyebrow: 'eatkcal store rating', title: 'How the rating and the New badge work', aria: vs + ' out of 5 stars, last 3 months', newB: 'New', newAria: 'New store, fewer than 10 reviews so far',
          capA: '10 or more reviews', capB: 'Fewer than 10 reviews', subA: 'Last 3 months, [N] reviews', subB: 'Fewer than 10 reviews so far',
          rules: [['Last 3 months only', 'The score is the average of reviews from the last 3 months, so it reflects the kitchen today.'],
                  ['Half-star display', 'The average is rounded to the nearest half star; the number sits next to the stars.'],
                  ['Three dimensions', 'Delivery, Calorie match and Taste are each averaged and shown as small bars on the store page and in reviews.'],
                  ['New badge', 'With fewer than 10 reviews in the last 3 months, a New badge replaces the stars. Stars appear from the 10th review.'],
                  ['Accessible label', 'VoiceOver reads the stars as one label, for example “' + vs + ' out of 5 stars, last 3 months”.']] }
      : { eyebrow: 'eatkcal mağaza puanı', title: 'Puan ve “Yeni” rozeti nasıl çalışır', aria: '5 üzerinden ' + vs + ' yıldız, son 3 ay', newB: 'Yeni', newAria: 'Yeni mağaza, henüz 10 değerlendirme yok',
          capA: '10 ve üzeri değerlendirme', capB: '10’dan az değerlendirme', subA: 'Son 3 ay, [N] değerlendirme', subB: 'Henüz 10 değerlendirme yok',
          rules: [['Yalnız son 3 ay', 'Puan, son 3 ayın değerlendirmelerinin ortalamasıdır; mutfağın bugünkü hâlini gösterir.'],
                  ['Yarım yıldız gösterimi', 'Ortalama en yakın yarım yıldıza yuvarlanır; sayı yıldızların yanında yazar.'],
                  ['Üç boyut', 'Teslimat, Kalori uyumu ve Lezzet ayrı ayrı ortalanır; mağaza sayfasında ve yorumlarda küçük çubuk olarak görünür.'],
                  ['“Yeni” rozeti', 'Son 3 ayda 10’dan az değerlendirme varsa yıldız yerine “Yeni” rozeti gösterilir. 10. değerlendirmeyle yıldızlar gelir.'],
                  ['Erişilebilir etiket', 'VoiceOver yıldızları tek etiketle okur, örneğin “5 üzerinden ' + vs + ' yıldız, son 3 ay”.']] };
    return {
      c: c, L: L, stars: stars, val: vs,
      cards: [
        { cap: L.capA, name: 'kcalculate', img: 't19/ph-tavuk-kinoa.jpg', rated: true, isNew: false, sub: L.subA },
        { cap: L.capB, name: 'Breaking Fast', img: 't19/ph-menemen.jpg', rated: false, isNew: true, sub: L.subB }
      ],
      rules: L.rules.map(function (r, i) { return { n: i + 1, t: r[0], d: r[1] }; })
    };
  }
}
</script>
</body>
</html>
