        muted: !!c.muted, hasCount: !!c.count, count: '[N]', hasDot: !!c.dot,
        nameWeight: unread ? 'font-weight: 700' : 'font-weight: 600',
        prevStyle: unread ? 'color: ' + t.text + '; font-weight: 600' : (c.typing ? 'color: ' + t.sec + '; font-style: italic' : 'color: ' + t.sec),
        href: c.href || chatHref,
        a11y: c.name + ', ' + c.prev + ', ' + c.time + (c.count ? ', ' + s.unreadN : c.dot ? ', ' + s.unread : '') + (c.muted ? ', ' + s.muted : '')
      };
    });
    var requests = [[s.name, s.rq1, s.min], [s.name, s.rq2, s.hour], [s.name, s.rq3, s.day]].map(function (r) {
      return { name: r[0], preview: r[1], time: r[2], a11y: r[0] + ', ' + r[1] + ', ' + r[2] };
    });
    var suggested = [
      { isGroup: true, isPerson: false, name: s.g1, sub: s.sg1, href: groupHref },
      { isGroup: false, isPerson: true, name: s.name, sub: s.sg2, href: chatHref },
      { isGroup: false, isPerson: true, name: s.rd, sub: s.sg3, href: chatHref }
    ].map(function (p) { p.a11y = s.message + ', ' + p.name; return p; });
    var tabs = [['chats', s.chatsTab], ['requests', s.reqTab]].map(function (x) {
      var on = st.tab === x[0];
      return {
        label: st.empty && x[0] === 'requests' ? s.reqTabPlain : x[1], aria: on ? 'true' : 'false',
        weight: on ? 'font-weight: 700' : 'font-weight: 500',
        bar: on ? 'background: ' + t.text : 'background: transparent',
        pick: function () { self.setState({ tab: x[0] }); }
      };
    });
    var isReqTab = st.tab === 'requests';
    return {
      t: t, s: s, fieldCls: dark ? 'ibqD' : 'ibqL', query: st.query,
      onType: function (e) { self.setState({ query: e.target.value }); },
      tabs: tabs, chats: chats, requests: requests, suggested: suggested,
      newHref: 'FinChatNew' + suf + '.dc.html', reqHref: suf === '' ? 'FinChatRequest.dc.html' : chatHref,
      isChats: !isReqTab && !st.empty, isRequests: isReqTab && !st.empty,
      isChatsEmpty: !isReqTab && st.empty, isReqEmpty: isReqTab && st.empty
    };
  }
}
</script>

</html>
