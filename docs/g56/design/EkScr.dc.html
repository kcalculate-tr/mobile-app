      D.isSheet = true; D.title = packT; D.sub = T('3 / 3 Özet', '3 / 3 Summary'); D.prog = 3;

        rows([

          { t: T('Pazartesi, Çarşamba, Cuma', 'Monday, Wednesday, Friday'), d: tm('12.00–13.00') },
          { t: T('Ev', 'Home'), d: T('Konak, İzmir', 'Konak, Izmir'), chev: true }
        ]),
        rows([
          { t: T('Paket tutarı', 'Pack subtotal'), r: PR, rw: 600 },
          { t: T('Paket indirimi', 'Pack discount'), r: '−[N] TL', rw: 600 },
          { t: T('Teslimat', 'Delivery'), r: PR, rw: 600 },

      D.isPhone = false; D.hasNav = false; D.H = 200;

        { t: T('Adreslerim', 'My addresses'), chev: true }
      ])];
    } else {
      var empty = scr === 'davetBos';
      D.title = T('Arkadaşını davet et', 'Invite a friend');
      D.blocks = [
        { isHero: true, t: T('İkinize de [N] TL kupon', '[N] TL coupon for both of you'), codeL: T('Davet kodun', 'Your invite code'), code: '[KOD]', copy: T('Kodu kopyala', 'Copy code'), share: T('Kodu paylaş', 'Share code') },
        line(T('Nasıl çalışır', 'How it works'), '', true),
        rows([
          { num: '1', t: T('Kodunu arkadaşınla paylaş', 'Share your code with a friend') },
          { num: '2', t: T('Arkadaşın kodla ilk siparişini verir', 'Your friend places a first order with the code') },
          { num: '3', numOn: true, t: T('İkinize de [N] TL kupon tanımlanır', 'You both get a [N] TL coupon') }
        ]),
        line(T('Davet geçmişi', 'Invite history'), '', true),
        empty
          ? { isEmpty: true, t: T('Henüz davetin yok', 'No invites yet'), d: T('Kodunu paylaştığın arkadaşların burada görünür.', 'Friends you share your code with will show up here.') }
          : rows([
            { t: T('[Ad]', '[Name]'), d: T('[Tarih]', '[Date]'), pill: T('Kazanıldı', 'Earned'), pillOn: true },
            { t: T('[Ad]', '[Name]'), d: T('[Tarih]', '[Date]'), pill: T('Bekliyor', 'Pending') }
          ])

      if (scr === 'davetKopya') D.toast = T('Kod kopyalandı', 'Code copied');
    }
    return {
      t: t, s: s, langAttr: en ? 'en' : 'tr', H: D.H + 'px', R: D.isPhone ? '44px' : '0', isPhone: D.isPhone, statusInk: D.isSheet ? '#FFFFFF' : t.ink,
      isSheet: D.isSheet, isPush: !D.isSheet && D.hasNav, hasNav: D.hasNav, role: D.isSheet ? 'dialog' : 'main', top: D.isSheet ? '62px' : '0', panelR: D.isSheet ? '28px 28px 0 0' : '0',

      hasProg: D.prog > 0, prog: prog(D.prog), progA11y: T('Adım ' + D.prog + ' / 3', 'Step ' + D.prog + ' of 3'),
      blocks: D.blocks, hasCta: !!D.cta, cta: D.cta, hasCtaL: !!D.ctaL, ctaL: D.ctaL, ctaV: D.ctaV, ctaDis: D.ctaDis ? 'true' : 'false', ctaBg: D.ctaDis ? t.nest : LIME, ctaFg: D.ctaDis ? t.sec : '#0A0A0A',
      hasToast: !!D.toast, toast: D.toast
    };
