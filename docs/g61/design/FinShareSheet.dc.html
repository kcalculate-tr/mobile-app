<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.glL{background:rgba(255,255,255,0.84);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.glD{background:rgba(28,28,30,0.84);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
@media (prefers-reduced-transparency: reduce){.glL{background:#FFFFFF;backdrop-filter:none;-webkit-backdrop-filter:none}.glD{background:#1C1C1E;backdrop-filter:none;-webkit-backdrop-filter:none}}
.scr{scrollbar-width:none;scroll-snap-type:x mandatory}.scr::-webkit-scrollbar{display:none}
/* motion = FinShareDay / FinMoTokens x1.1: sheet 500 emphasized, scrim 300, toast 300, selection 220, skeleton 990 */
.sheetIn{animation:sheetIn 500ms cubic-bezier(0.05, 0.7, 0.1, 1) both}
.scrimIn{animation:fadeIn 300ms cubic-bezier(0.2, 0, 0, 1) both}
.toastIn{animation:toastIn 300ms cubic-bezier(0.05, 0.7, 0.1, 1) both}
.sel{transition:box-shadow 220ms cubic-bezier(0.2, 0, 0, 1)}
.sw{transition:transform 200ms cubic-bezier(0.2, 0, 0, 1)}
.sk{animation:sk 990ms cubic-bezier(0.2, 0, 0, 1) infinite alternate}
.tgt{transition:transform 110ms cubic-bezier(0.2, 0, 0, 1)}
.tgt:active{transform:scale(.96)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sk{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheetIn,.scrimIn,.toastIn{animation:fadeIn 200ms linear both!important;transform:none!important}.sel,.sw{transition:none}.sk{animation:none}.tgt:active{transform:none}}
</style>
</helmet>
