<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kcalculate — Paylaşılan öğün</title>
  <meta name="description" content="Bu öğün Kcalculate ile paylaşıldı. Kalori ve protein tahminiyle kendi beslenme takibini yap." />
  <!-- Sosyal önizleme (link unfurl) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kcalculate" />
  <meta property="og:title" content="Kcalculate — Paylaşılan öğün" />
  <meta property="og:description" content="Bu öğün Kcalculate ile paylaşıldı. Sen de kalori ve protein tahminiyle takip et." />
  <meta name="twitter:card" content="summary_large_image" />
  <!--
    NOT (G5-S4): /p/<post_id> yolu Vercel rewrite ile bu sayfaya düşer. Uygulama
    kuruluysa Universal/App Link uygulamayı açar ve bu sayfa HİÇ görünmez; burası
    yalnız "uygulama yok" durumundaki hafif web önizlemesidir. App Store numarası
    İlter tarafından doldurulacak (bkz. docs/night/G5-S4-LINKS.md).
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0A0A; --surface: #141414; --border: #232323;
      --green: #B9EF14; --green2: #D2F55E;
      --text: #FFFFFF; --muted: rgba(255,255,255,0.55); --sub: rgba(255,255,255,0.75);
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 28px; line-height: 1.5;
    }
    .wrap { width: 100%; max-width: 420px; text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(185,239,20,0.10); border: 1px solid rgba(185,239,20,0.35);
      color: var(--green2); border-radius: 100px; padding: 6px 16px;
      font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 22px;
    }
    .icon {
      width: 92px; height: 92px; border-radius: 46px; margin: 0 auto 22px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
    p.lead { color: var(--sub); font-size: 15px; margin-bottom: 30px; }
    .stores { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .store-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--green); color: #0A0A0A; text-decoration: none;
      font-weight: 700; font-size: 15px; border-radius: 100px; padding: 15px 20px;
      transition: transform 0.15s, background 0.2s;
    }
    .store-btn:active { transform: scale(0.98); }
    .store-btn.ghost { background: transparent; color: var(--green2); border: 1px solid rgba(185,239,20,0.4); }
    .brand { margin-top: 26px; font-weight: 800; font-size: 15px; color: var(--muted); letter-spacing: 0.5px; }
    .brand span { color: var(--green); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Paylaşılan öğün</div>
    <div class="icon" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 256 256" fill="var(--green)">
        <path d="M80 24a8 8 0 0 0-16 0v64a16 16 0 0 0 0 0 24 24 0 0 0 16 22.6V232a8 8 0 0 0 16 0V110.6A24 24 0 0 0 112 88V24a8 8 0 0 0-16 0v64H80Zm96-8a56 56 0 0 0-56 56c0 25.5 16.8 47 40 54.2V232a8 8 0 0 0 16 0V16Z"/>
      </svg>
    </div>
    <h1 id="title">Bu öğün Kcalculate ile paylaşıldı</h1>
    <p class="lead">Kendi öğünlerini kalori ve protein tahminiyle takip etmek için Kcalculate'i indir.</p>

    <div class="stores">
      <a class="store-btn" id="openApp" href="#">Uygulamada aç</a>
      <a class="store-btn" id="appstore" href="#">App Store'dan indir</a>
      <a class="store-btn ghost" id="playstore" href="#">Google Play'den indir</a>
    </div>

    <div class="brand">Kcal<span>culate</span></div>
  </div>

  <script>
    (function () {
      // App Store numarası henüz yok — İlter dolduracak (G5-S4-LINKS.md).
      var APPSTORE_URL = '#';
      var PLAYSTORE_URL = 'https://play.google.com/store/apps/details?id=com.kcalmobile.app';

      var appstore = document.getElementById('appstore');
      var playstore = document.getElementById('playstore');
      if (APPSTORE_URL !== '#') appstore.href = APPSTORE_URL;
      playstore.href = PLAYSTORE_URL;

      // Yoldan post_id: /p/<id>
      var parts = location.pathname.split('/').filter(Boolean);
      var postId = parts.length >= 2 ? decodeURIComponent(parts[1]) : '';

      // "Uygulamada aç" — özel şema ile uygulamayı dener (kuruluysa).
      var openApp = document.getElementById('openApp');
      openApp.href = postId ? ('kcal://p/' + encodeURIComponent(postId)) : 'kcal://';
    })();
  </script>
</body>
</html>
