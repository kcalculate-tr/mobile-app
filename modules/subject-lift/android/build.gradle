// G29-S1 md.1 — KCAL yerel Expo modülü (repo içinde, npm paketi DEĞİL): çıkartma (subject lift).
// YENİ BAĞIMLILIK (İlter onayı 11 Kas): Google Play hizmetleri ML Kit Subject Segmentation.
// Model APK'ya gömülmez; Play hizmetleriyle iner (manifest meta-data `subject_segment`,
// app.plugin.js). İnmemişse işlem hata verir → JS tarafı sessizce normal fotoğrafa düşer.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.subjectlift'
version = '1.0.0'

android {
  namespace "expo.modules.subjectlift"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
}
